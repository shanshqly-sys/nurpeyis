<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lab Quest</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive RPG-style CV: a pixel-art lab with my research techniques.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
/* Layout: the pixel lab (three rooms) fills the screen; HUD floats in the corners; RPG windows slide in only after you pick a machine or your portrait */
:root{
  --bg:#070914;
  --win1:#2c43b0; --win2:#0f185a; --edge:#eef1ff; --rim:#04061a;
  --text:#f2f4ff; --muted:#aab4ea; --gold:#ffd35c; --green:#5be38e; --orange:#ff9a5c;
  --px:"Press Start 2P", "Courier New", monospace;
  --vt:"VT323", "Courier New", monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--text); font-family:var(--vt); font-size:22px; line-height:1.15; overflow:hidden}
.px{font-family:var(--px); font-size:11px; letter-spacing:.04em; line-height:1.7}
h1,h2,h3{margin:0; font-weight:400}
button{font:inherit; color:inherit}
:focus-visible{outline:2px dashed var(--gold); outline-offset:3px}
[hidden]{display:none!important}
.say{
  position:absolute; left:0; top:0; z-index:5; pointer-events:none; width:max-content; max-width:min(300px, 70vw);
  padding:8px 12px; background:#ffffff; color:#11142b; border:3px solid #11142b; border-radius:8px;
  font-family:var(--vt); font-size:21px; line-height:1.1; box-shadow:0 4px 0 rgba(0,0,0,.35); translate:-50% calc(-100% - 12px);
}
.say::after{content:""; position:absolute; left:50%; bottom:-14px; translate:-50% 0; border:7px solid transparent; border-top-color:#11142b}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

.game{
  position:relative; overflow:hidden; width:100%;
  height:calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  height:calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
}
#cv{position:absolute; inset:0; width:100%; height:100%; display:block; image-rendering:pixelated; touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
button{touch-action:manipulation; -webkit-tap-highlight-color:transparent}
.room-label{
  position:absolute; left:0; top:0; pointer-events:none; white-space:nowrap;
  font-family:var(--px); font-size:clamp(7px, .8vw, 10px); letter-spacing:.12em; color:#c9d1ec;
  translate:-50% -50%; text-shadow:0 2px 0 #000; transition:opacity .3s;
}

/* RPG window */
.win{
  background:linear-gradient(180deg, var(--win1), var(--win2));
  border:3px solid var(--edge); border-radius:10px;
  box-shadow:0 0 0 3px var(--rim), inset 0 0 0 2px rgba(4,6,26,.45), 0 6px 0 3px rgba(0,0,0,.3);
  padding:14px 16px; min-width:0;
}
.win h3{color:var(--gold); margin-bottom:12px}

/* HUD */
.hud-me{
  position:absolute; z-index:4; top:calc(14px + env(safe-area-inset-top, 0px)); left:max(14px, env(safe-area-inset-left, 0px));
  display:grid; grid-template-columns:auto auto; gap:12px; align-items:center; text-align:left; cursor:pointer;
  padding:8px 14px 8px 8px; max-width:calc(100% - 28px);
}
.hud-me:hover .face{box-shadow:0 0 0 3px var(--gold)}
.face{
  width:58px; aspect-ratio:1; max-width:100%; border:3px solid var(--edge); border-radius:4px; overflow:hidden; box-shadow:0 0 0 3px var(--rim);
  display:grid; place-items:center; text-align:center;
  background:repeating-linear-gradient(135deg, #1b2770 0 6px, #22318a 6px 12px);
}
.face img{width:100%; height:100%; object-fit:cover; display:block}
.face span{font-family:var(--px); font-size:6px; line-height:1.8; color:var(--muted)}
.hud-me .nm{font-family:var(--px); font-size:11px; display:block}
.hud-me .cl{display:block; color:var(--muted); font-size:19px; margin-top:4px}
.hud-me .tip{display:block; color:var(--gold); font-family:var(--px); font-size:7px; margin-top:4px}
.sample{
  position:absolute; z-index:4; top:calc(14px + env(safe-area-inset-top, 0px)); right:max(14px, env(safe-area-inset-right, 0px));
  font-family:var(--px); font-size:7px; letter-spacing:.06em; padding:6px 8px; border:2px dashed var(--orange); color:var(--orange); border-radius:4px; background:rgba(7,9,20,.7);
}
.bottom{
  position:absolute; z-index:4; left:max(14px, env(safe-area-inset-left, 0px)); bottom:calc(14px + env(safe-area-inset-bottom, 0px));
  display:grid; gap:8px; justify-items:start; max-width:calc(100% - 28px);
}
.bottom .row{display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap}
.status{margin:0; padding:8px 14px; font-size:20px; max-width:420px; display:flex; gap:8px}
.status::before{content:"▶"; color:var(--gold); font-size:14px; line-height:1.4}
.hotbar{display:flex; gap:6px; padding:8px; flex-wrap:nowrap; overflow-x:auto; max-width:calc(100vw - 28px); scrollbar-width:none}
.hb{position:relative; flex:0 0 auto; width:58px; height:48px; padding:0; border:0; background:none; cursor:pointer; border-radius:4px}
.hb canvas{width:100%; height:100%; display:block; image-rendering:pixelated; border-radius:3px; box-shadow:0 0 0 2px var(--rim); background:#d6dbe2}
.hb .k{position:absolute; left:3px; top:2px; font-family:var(--px); font-size:7px; color:#fff; text-shadow:1px 1px 0 #000}
.hb .tt{
  position:absolute; left:50%; bottom:calc(100% + 12px); translate:-50% 0; white-space:nowrap; pointer-events:none;
  font-family:var(--px); font-size:8px; padding:6px 8px; background:var(--rim); border:2px solid var(--edge); border-radius:4px; opacity:0; transition:opacity .15s;
}
.hb:hover .tt, .hb:focus-visible .tt{opacity:1}
.hb.on canvas, .hb:hover canvas{box-shadow:0 0 0 3px var(--gold)}
.keys{color:var(--muted); font-size:7px; margin:0 4px}
@media (hover:none){ .keys{display:none} }

/* info panel */
.panel{
  position:absolute; z-index:6; top:calc(14px + env(safe-area-inset-top, 0px)); bottom:calc(14px + env(safe-area-inset-bottom, 0px));
  right:max(14px, env(safe-area-inset-right, 0px)); width:min(460px, 42vw);
  overflow-y:auto; overscroll-behavior:contain; display:flex; flex-direction:column; gap:20px; padding:6px 6px 14px;
  scrollbar-width:thin; scrollbar-color:var(--edge) transparent;
}
.panel > *{flex-shrink:0}
.panel.in{animation:slide .4s steps(6) both}
.game.open .sample{display:none}
.game.open .status{visibility:hidden}
@keyframes slide{from{opacity:0; transform:translateX(30px)} to{opacity:1; transform:none}}
.close{position:sticky; top:0; z-index:2; align-self:flex-end; font-family:var(--px); font-size:9px; padding:9px 12px; cursor:pointer; border-radius:6px;
  background:var(--rim); border:3px solid var(--edge)}
.close:hover{color:var(--gold)}

.head .eq{color:var(--gold); font-size:10px}
.head h2{font-family:var(--px); font-size:16px; line-height:1.5; margin:8px 0 14px; text-wrap:balance}
.head h2:focus{outline:none}
.stats{display:grid; gap:8px}
.stat{display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:10px; align-items:center}
.stat .k{color:var(--gold); font-size:10px}
.stat .v{font-size:9px; white-space:nowrap}
.pips{display:flex; gap:4px}
.pips i{width:16px; height:12px; background:rgba(4,6,26,.55); box-shadow:inset 0 0 0 2px rgba(238,241,255,.25)}
.pips i.on{background:var(--gold); box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.bar{height:12px; background:rgba(4,6,26,.55); box-shadow:inset 0 0 0 2px rgba(238,241,255,.25); position:relative}
.bar i{position:absolute; inset:0 auto 0 0; background:var(--green); box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.dialog{position:relative; cursor:pointer; min-height:7em}
.dialog p{margin:0}
.more{position:absolute; right:14px; bottom:8px; color:var(--gold); font-size:16px; animation:blink 1s steps(1) infinite; visibility:hidden}
.dialog.done .more{visibility:visible}
@keyframes blink{50%{opacity:0}}
.quests{list-style:none; margin:0; padding:0; display:grid}
.quests li{display:grid; gap:4px; padding-block:10px; border-top:2px dotted rgba(238,241,255,.25)}
.quests li:first-child{border-top:0; padding-top:0}
.quests .when{color:var(--gold); font-size:9px}
.quests .at{color:var(--muted)}
.quests p{margin:0; font-size:20px}
.items{display:flex; flex-wrap:wrap; gap:8px}
.items span{font-size:20px; padding:2px 10px; border:2px solid rgba(238,241,255,.4); border-radius:4px; background:rgba(4,6,26,.3)}
.items span::before{content:"◆ "; color:var(--gold); font-size:14px}
.nav{display:flex; gap:10px; flex-wrap:wrap}
.nav .sp{flex:1}
.btn{
  font-family:var(--px); font-size:10px; padding:12px 14px; cursor:pointer; border-radius:6px;
  background:linear-gradient(180deg, var(--win1), var(--win2)); border:3px solid var(--edge); box-shadow:0 0 0 3px var(--rim), 0 4px 0 3px rgba(0,0,0,.3);
}
.btn:hover{color:var(--gold)}
.btn:active{transform:translateY(2px)}

/* about */
.me-top{display:grid; grid-template-columns:120px minmax(0,1fr); gap:16px; align-items:center}
.me-top .face{width:120px}
.me-top .face span{font-size:8px}
.hero-fig{width:120px; aspect-ratio:3/4; max-width:100%; border:3px solid var(--edge); border-radius:4px; overflow:hidden; box-shadow:0 0 0 3px var(--rim);
  background:repeating-linear-gradient(135deg, #1b2770 0 6px, #22318a 6px 12px)}
.hero-fig svg{display:block; width:100%; height:100%}
.hero-fig .wave{transform-origin:84px 68px; animation:wave 1.1s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-14deg)} to{transform:rotate(16deg)}}
@media (prefers-reduced-motion: reduce){ .hero-fig .wave{animation:none} }
.me-top h2{font-family:var(--px); font-size:16px; line-height:1.5; margin:6px 0; overflow-wrap:anywhere}
.mini{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; margin:14px 0 0}
.mini dt{font-family:var(--px); font-size:9px; color:var(--gold); padding-top:5px}
.mini dd{margin:0}
.contacts{display:grid; gap:2px; color:var(--muted); font-size:20px; margin-top:12px}
.contacts b{color:var(--text); font-weight:400}
.skill-links{list-style:none; margin:0; padding:0; display:grid; gap:2px}
.skill-links button{width:100%; display:flex; justify-content:space-between; gap:12px; background:none; border:0; padding:6px 8px; border-radius:4px; cursor:pointer; text-align:left}
.skill-links button:hover{background:rgba(4,6,26,.3); color:var(--gold)}
.skill-links .y{font-family:var(--px); font-size:9px; color:var(--muted); white-space:nowrap; padding-top:6px}
.note{font-family:var(--px); font-size:8px; color:var(--orange); line-height:1.8}

/* bottom-sheet details on phones and portrait tablets */
@media (max-width:760px), (orientation:portrait) and (max-width:1100px){
  .panel{left:max(8px, env(safe-area-inset-left, 0px)); right:max(8px, env(safe-area-inset-right, 0px)); width:auto; top:auto; height:58%; bottom:calc(8px + env(safe-area-inset-bottom, 0px)); gap:16px}
  .panel.in{animation-name:rise}
  .game.open .bottom{display:none}
}
@keyframes rise{from{opacity:0; transform:translateY(30px)} to{opacity:1; transform:none}}
/* phones */
@media (max-width:760px){
  .hud-me .cl{font-size:17px}
  .face{width:46px}
  .hb{width:42px; height:34px; flex:0 0 auto}
  .status{font-size:18px}
  .bottom .row{flex-direction:column-reverse; align-items:flex-start; gap:8px}
  .sample{display:none}
  .me-top{grid-template-columns:90px minmax(0,1fr)}
  .me-top .face, .me-top .hero-fig{width:90px}
  .head h2, .me-top h2{font-size:14px}
}
/* short screens (phones held sideways): slim HUD, more room for the lab */
@media (max-height:520px){
  body{font-size:19px}
  .hud-me{top:calc(8px + env(safe-area-inset-top, 0px)); padding:4px 10px 4px 4px; gap:8px}
  .hud-me .cl{display:none}
  .hud-me .tip{margin-top:2px}
  .face{width:34px; border-width:2px}
  .face span{font-size:5px}
  .bottom{bottom:calc(8px + env(safe-area-inset-bottom, 0px))}
  .bottom .row{flex-direction:row; align-items:flex-end}
  .status{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); padding:0; border:0; margin:0}
  .keys{display:none}
  .hotbar{padding:5px; gap:4px}
  .hb{width:40px; height:32px}
  .sample{display:none}
  .panel{top:calc(8px + env(safe-area-inset-top, 0px)); bottom:calc(8px + env(safe-area-inset-bottom, 0px)); width:min(400px, 50vw); gap:14px}
  .panel .win{padding:10px 12px}
  .head h2, .me-top h2{font-size:13px; margin:6px 0 10px}
  .me-top{grid-template-columns:70px minmax(0,1fr)}
  .me-top .face, .me-top .hero-fig{width:70px}
  .dialog{min-height:0}
}
@media (prefers-reduced-motion: reduce){ .panel.in,.more{animation:none} }
</style>
</head>
<body>
<div class="game" id="game">
  <canvas id="cv" role="img" aria-label="Pixel-art lab with three rooms: an office with an analysis workstation; a molecular lab with a qPCR cycler, a sequencer, a gel electrophoresis tank, a western blot station, a fluorescence microscope and a patch-clamp rig; and a clean room with a biosafety cabinet, incubators, a centrifuge and a flow cytometer"></canvas>
  <span class="room-label" data-room="0">OFFICE</span>
  <span class="room-label" data-room="1">MOLECULAR LAB</span>
  <span class="room-label" data-room="2">CLEAN ROOM</span>

  <button class="hud-me win" id="me" aria-label="About me">
    <span class="face" id="hudFace"><span>YOUR<br>PHOTO</span></span>
    <span><span class="nm" id="hudName">Your Name</span><span class="cl" id="hudRole"></span><span class="tip">▶ ABOUT ME</span></span>
  </button>

  <div class="bottom">

      <nav class="hotbar win" id="hotbar" aria-label="Equipment"></nav>
      <p class="status win" id="status" aria-live="polite">Click a machine to see my experience with it.</p>

  <div class="say" id="say" hidden aria-hidden="true"><span id="sayText"></span></div>
  <aside class="panel" id="panel" hidden aria-label="Details"></aside>
</div>

function bfs(s,e){
  const key=(x,y)=>y*COLS+x, prev=new Map([[key(s[0],s[1]),null]]), q=[s];
  while(q.length){
    const [x,y]=q.shift(); if(x===e[0]&&y===e[1]) break;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx, ny=y+dy, k=key(nx,ny);
      if(prev.has(k) || !canStep(x,y,nx,ny)) continue;
      prev.set(k,[x,y]); q.push([nx,ny]);
    }
  }
  if(!prev.has(key(e[0],e[1]))) return [];
  const path=[]; let c=e;
  while(c && !(c[0]===s[0]&&c[1]===s[1])){ path.unshift(c); c=prev.get(key(c[0],c[1])); }

    const x=Math.round(player.x), y=Math.round(player.y);

  doorOpen = reduce ? (near?1:0) : Math.max(0, Math.min(1, doorOpen + (near?1:-1)*dt*5));
  if(mode==='alert' && now-alertT>480) mode='zooming';
  if(mode==='jutsu' && jutsu){
    const e=now-jutsu.t0, o=OBJS[target];
    if(!jutsu.a && e>=420){ jutsu.a=true; puff(player.x*T+8, player.y*T+8, now/1000); player.hidden=true; }
    if(!jutsu.b && e>=760){ jutsu.b=true; player.x=o.spot[0]; player.y=o.spot[1]; player.dir=o.spot[2]; player.pose=null; puff(player.x*T+8, player.y*T+8, now/1000); }
    if(jutsu.b && e>=830) player.hidden=false;
    if(e>=1150){ jutsu=null; mode='zooming'; }
  }
  const d=desiredCam();
  if(!cam || reduce) cam={...d};
  else {
    const k=1-Math.exp(-dt*5.5);
    cam.cx+=(d.cx-cam.cx)*k; cam.cy+=(d.cy-cam.cy)*k; cam.ax+=(d.ax-cam.ax)*k; cam.ay+=(d.ay-cam.ay)*k;
    cam.z=Math.exp(Math.log(cam.z)+(Math.log(d.z)-Math.log(cam.z))*k);
  }
  if(mode==='zooming' && Math.abs(Math.log(cam.z/d.z))<.06 && Math.hypot(cam.cx-d.cx,cam.cy-d.cy)<3){ mode='zoomed'; showDetail(target); }
  if(mode==='leaving' && Math.abs(Math.log(cam.z/d.z))<.03) mode='idle';
}
/* clean-room sliding door: two glass leaves retract into the wall when someone is near */
function drawDoor(){
  const h=Math.round(16*(1-doorOpen));
  if(h>0){
    [[80,h],[112-h,h]].forEach(([y,hh])=>{
      g.fillStyle='rgba(159,211,230,.85)'; g.fillRect(349,y,7,hh);
      R(349,y,1,hh,'#6f9fb8'); R(355,y,1,hh,'#6f9fb8'); g.fillStyle='rgba(255,255,255,.6)'; g.fillRect(351,y,1,hh);
    });
    R(349,80+h-1,7,1,'#4b5468'); R(349,112-h,7,1,'#4b5468');
  }
  const c=doorOpen>.5?C.green:C.red;
  R(345,88,3,5,C.K); R(345,89,3,2,c); R(357,88,3,5,C.K); R(357,89,3,2,c);
}
function drawWorld(t, withPlayer){
  g.drawImage(bg,0,0);
  drawDoor();
  const busy=withPlayer&&(mode==='zoomed'||mode==='zooming')&&target!=null&&!player.pose&&!player.path.length ? OBJS[target] : null;
  const items=[...OBJS,...DECOR].map(o=>({ b:o.b, f:()=>drawObj(o,t,o===busy) }));
  if(withPlayer){
    const moving=player.path.length>0, fr=moving?[0,1,0,2][Math.floor(player.walk*4)%4]:0;
    hopNow = aboutOpen && !reduce ? hopAt(t-aboutT) : 0;
    if(!player.hidden) items.push({ b:player.y*T+T+.5, f:()=>drawPlayer(player.x*T+2, player.y*T-2, player.dir, fr, t, player.pose, hopNow, (mode==='zoomed'||mode==='zooming')&&target!=null&&!player.pose&&!player.path.length ? OBJS[target].act : null) });
  }
  items.sort((a,b)=>a.b-b.b).forEach(it=>it.f());
  if(withPlayer){ drawFx(t); if(aboutOpen) drawSparkles(t); }
}
let view={vx:0,vy:0,z:1};
const labels=[...document.querySelectorAll('.room-label')];
function render(t){
  drawWorld(t,true);
  const bounce=reduce?0:Math.round(Math.sin(t*6)*1.5);
  const arrowOn=(mode==='idle'||mode==='leaving')&&!aboutOpen ? hi : (mode==='walking' ? target : null);
  if(arrowOn!=null){ const [bx,by,bw]=OBJS[arrowOn].box; drawArrow(Math.round(bx+bw/2), Math.max(3,by-10)+bounce); }
  if(mode==='alert') drawAlert(player.x*T+2, player.y*T-2);

  const cw=cv.width, ch=cv.height, z=cam.z;
  const vx=cam.cx-cam.ax/z, vy=cam.cy-cam.ay/z;
  view={vx,vy,z};
  ctx.fillStyle='#070914'; ctx.fillRect(0,0,cw,ch);
  const ix0=Math.max(0,vx), iy0=Math.max(0,vy), ix1=Math.min(W,vx+cw/z), iy1=Math.min(H,vy+ch/z);
  if(ix1>ix0 && iy1>iy0){
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(wc, ix0,iy0,ix1-ix0,iy1-iy0, (ix0-vx)*z,(iy0-vy)*z,(ix1-ix0)*z,(iy1-iy0)*z);
  }
  const k=Math.min(1,Math.max(0,(z/z0-1)/1.2));
  if(k>0){
    const gr=ctx.createRadialGradient(cam.ax,cam.ay,Math.min(cw,ch)*.25, cam.ax,cam.ay,Math.max(cw,ch)*.75);
    gr.addColorStop(0,'rgba(7,9,20,0)'); gr.addColorStop(1,`rgba(7,9,20,${.6*k})`);
    ctx.fillStyle=gr; ctx.fillRect(0,0,cw,ch);
  }
  if(!sayEl.hidden){
    const bw=sayEl.offsetWidth, bh=sayEl.offsetHeight;
    let sx=((player.x*T+8)-vx)*z/dpr, sy=((player.y*T-6-hopNow)-vy)*z/dpr;
    sx=Math.min(Math.max(sx, bw/2+10), window.innerWidth-bw/2-10); sy=Math.max(sy, bh+20);
    sayEl.style.transform=`translate(${sx.toFixed(1)}px, ${sy.toFixed(1)}px)`;
  }
  labels.forEach((el,i)=>{
    const lx=i===0?40:(ROOMS[i][0]+ROOMS[i][1])/2, ly=i===0?176:312;
    const sx=(lx-vx)*z/dpr, sy=(ly-vy)*z/dpr;
    el.style.transform=`translate(${sx.toFixed(1)}px, ${sy.toFixed(1)}px)`;
    el.style.opacity = k>.3 ? 0 : 1;
  });
}
let last=performance.now();
function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; update(dt,now); render(now/1000); requestAnimationFrame(loop); }

/* ================= Input ================= */
function worldAt(e){
  const r=cv.getBoundingClientRect();
  return [ view.vx+(e.clientX-r.left)*dpr/view.z, view.vy+(e.clientY-r.top)*dpr/view.z ];
}
function hit(wx,wy){ return OBJS.findIndex(o=>{ const [x,y,w,h]=o.box; return wx>=x-2&&wx<=x+w+2&&wy>=y-2&&wy<=y+h+2; }); }
function hitPlayer(wx,wy){ const px=player.x*T, py=player.y*T-4; return wx>=px-2&&wx<=px+T+2&&wy>=py&&wy<=py+22; }
cv.addEventListener('pointermove',e=>{
  const [wx,wy]=worldAt(e), i=hit(wx,wy);
  cv.style.cursor=(i>=0||hitPlayer(wx,wy))?'pointer':'default';
  if(mode==='idle' && !aboutOpen) hi = i>=0 ? i : hi;
});
cv.addEventListener('click',e=>{
  const [wx,wy]=worldAt(e);
  if(hitPlayer(wx,wy)){ openAbout(); return; }
  const i=hit(wx,wy);
  if(i>=0){ select(i); return; }
  if(mode==='zoomed'||mode==='zooming'||aboutOpen){ back(); return; }
  const tx=Math.floor(wx/T), ty=Math.floor(wy/T);
  if(walkable(tx,ty) && (mode==='idle'||mode==='walking'||mode==='leaving')){ target=null; sel=null; markBar(); mode='walking'; goTo(tx,ty); }
});
const KEYDIR={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down',A:'left',D:'right',W:'up',S:'down'};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ back(); return; }
  const open=!panel.hidden;
  if(open && sel!=null && (e.key==='ArrowRight'||e.key==='ArrowLeft')){ e.preventDefault(); select((sel+(e.key==='ArrowRight'?1:OBJS.length-1))%OBJS.length); return; }
  if(open) return;
  if(/^[0-9]$/.test(e.key)){ const i=e.key==='0'?9:+e.key-1; if(i<OBJS.length){ select(i); return; } }
  if(KEYDIR[e.key]){
    e.preventDefault(); held=KEYDIR[e.key];
    if(mode==='zoomed'||mode==='zooming') back();
    return;
  }
  if(e.key===' '||e.key==='Enter'){
    if(document.activeElement && document.activeElement.tagName==='BUTTON') return;
    e.preventDefault();
    const x=Math.round(player.x), y=Math.round(player.y);
    const [dx,dy]={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]}[player.dir];
    let i=OBJS.findIndex(o=>o.spot[0]===x&&o.spot[1]===y);
    if(i<0) i=OBJS.findIndex(o=>o.fp.some(([fx,fy,fw,fh])=>x+dx>=fx&&x+dx<fx+fw&&y+dy>=fy&&y+dy<fy+fh));
    if(i<0){ const tx=x+dx, ty=y+dy; i=OBJS.findIndex(o=>{ const [bx,by,bw,bh]=o.box; return tx*T+8>=bx&&tx*T+8<=bx+bw&&ty*T+8>=by&&ty*T+8<=by+bh; }); }
    if(i>=0) select(i);
  }
});
document.addEventListener('keyup',e=>{ if(KEYDIR[e.key]===held) held=null; });
window.addEventListener('blur',()=>{ held=null; });

/* ================= HUD + panels ================= */

setStatus(`${TAP} a machine to see my experience with it.`);
$('hudName').textContent=PROFILE.name; $('hudRole').textContent=PROFILE.role; $('hudFace').innerHTML=faceHTML();
$('me').addEventListener('click',openAbout);

$('hotbar').innerHTML=OBJS.map((o,i)=>`<button class="hb" data-i="${i}" aria-label="${o.name}: ${esc(SKILLS[i].name)}"><canvas width="116" height="96" aria-hidden="true"></canvas><span class="k">${i+1}</span><span class="tt">${esc(SKILLS[i].name)}</span></button>`).join('');
const hbs=[...document.querySelectorAll('.hb')];
hbs.forEach((b,i)=>{ b.addEventListener('click',()=>select(i)); b.addEventListener('mouseenter',()=>{ if(mode==='idle') hi=i; }); b.addEventListener('focus',()=>{ if(mode==='idle') hi=i; }); });
function markBar(){ hbs.forEach((b,i)=>b.classList.toggle('on',i===sel)); }

let returnFocus=null;
function openPanel(html, focusSel){
  returnFocus = document.activeElement && document.activeElement!==document.body ? document.activeElement : null;
  panel.innerHTML=`<button class="close" data-act="close">✕ CLOSE</button>`+html;
  panel.hidden=false; game.classList.add('open'); panel.scrollTop=0;
  panel.classList.remove('in'); void panel.offsetWidth; panel.classList.add('in');
  panel.querySelector('[data-act="close"]').onclick=back;
  const f=panel.querySelector(focusSel); if(f) f.focus({preventScroll:true});
}
function closePanel(restore, lastI){
  if(typer){ cancelAnimationFrame(typer); typer=null; }
  if(panel.hidden) return;
  panel.hidden=true; game.classList.remove('open');
  if(restore){ const el = lastI!=null ? hbs[lastI] : $('me'); el && el.focus({preventScroll:true}); }
}
function showDetail(i){
  const s=SKILLS[i], o=OBJS[i];
  openPanel(`
    <div class="win head">
      <div class="px eq">▶ ${o.name}</div>

      <div class="stats">
        <div class="stat"><span class="px k">LV</span><span class="pips">${[1,2,3,4,5].map(n=>`<i class="${n<=s.level?'on':''}"></i>`).join('')}</span><span class="px v">${s.lvl||s.level+'/5'}</span></div>
        ${s.years==null?'':`<div class="stat"><span class="px k">EXP</span><span class="bar"><i style="width:${(s.years/maxYears*100).toFixed(0)}%"></i></span><span class="px v">${s.exp||s.years+(s.years===1?' YR':' YRS')}</span></div>`}
      </div>
    </div>
    <div class="win dialog" id="dlg"><span class="sr">${esc(s.desc)}</span><p id="typed" aria-hidden="true"></p><span class="more" aria-hidden="true">▼</span></div>
    ${s.jobs.length?`<div class="win"><h3 class="px">QUEST LOG</h3><ul class="quests">${s.jobs.map(j=>`
      <li>${j[0]?`<span class="px when">${esc(j[0].toUpperCase())}</span>`:''}<div>${esc(j[1])}${j[2]?` <span class="at">@ ${esc(j[2])}</span>`:''}</div><p>${esc(j[3])}</p></li>`).join('')}</ul></div>`:''}
    <div class="win"><h3 class="px">INVENTORY</h3><div class="items">${s.tools.map(t=>`<span>${esc(t)}</span>`).join('')}</div></div>
    <div class="nav">

      <h3 class="px" style="margin-top:16px">LANGUAGES</h3><p style="margin:0">${esc(PROFILE.languages)}</p></div>
    <div class="win"><h3 class="px">SKILLS</h3><ul class="skill-links">${SKILLS.map((s,i)=>`<li><button data-go="${i}"><span>▶ ${esc(s.name)}</span><span class="y">${s.years!=null?(s.exp||s.years+(s.years===1?' YR':' YRS')):s.lvl}</span></button></li>`).join('')}</ul></div>
`, '#ah');
  panel.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>select(+b.dataset.go));
}
const sayEl=$('say'), sayText=$('sayText'); let sayTimer=null, sayRaf=null;
function hideSay(){ clearTimeout(sayTimer); cancelAnimationFrame(sayRaf); sayEl.hidden=true; }
function say(text){
  hideSay(); sayEl.hidden=false; sayText.textContent='';
  const done=()=>{ sayText.textContent=text; sayTimer=setTimeout(()=>{ sayEl.hidden=true; }, 2600); };
  if(reduce){ done(); return; }
  const t0=performance.now();
  (function step(now){ const n=Math.floor((now-t0)*.045); if(n>=text.length){ done(); return; } sayText.textContent=text.slice(0,n); sayRaf=requestAnimationFrame(step); })(t0);
}
let typer=null;
function typeText(text){
  const el=$('typed'), box=$('dlg'); if(typer) cancelAnimationFrame(typer);
  const finish=()=>{ if(typer) cancelAnimationFrame(typer); typer=null; el.textContent=text; box.classList.add('done'); };
  box.onclick=finish;
  if(reduce){ finish(); return; }
  const t0=performance.now();
  (function step(now){ const n=Math.floor((now-t0)*.075); if(n>=text.length){ finish(); return; } el.textContent=text.slice(0,n); typer=requestAnimationFrame(step); })(t0);
}

/* ================= Boot ================= */
buildStatic();
drawWorld(0,false);
hbs.forEach((b,i)=>{
  const c=b.querySelector('canvas'), x=c.getContext('2d'), [bx,by,bw,bh]=OBJS[i].box;
  const s=Math.min(c.width/bw, c.height/bh), dw=bw*s, dh=bh*s;
  x.imageSmoothingEnabled=false; x.fillStyle='#d6dbe2'; x.fillRect(0,0,c.width,c.height);
  x.drawImage(wc,bx,by,bw,bh,(c.width-dw)/2,(c.height-dh)/2,dw,dh);
});
fit();
if('ResizeObserver' in window){ const ro=new ResizeObserver(fit); ro.observe(cv); ro.observe(document.getElementById('me')); ro.observe(document.querySelector('.bottom')); } else window.addEventListener('resize',fit);
requestAnimationFrame(loop);
